<!DOCTYPE html>

<html lang = "en">
<head>
    <title>Create Scheduler</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/air-datepicker@3.6.0/air-datepicker.css">
</head>

<body>
   
        <h1>Create Scheduler</h1>
       
 <form method = "post">
    <div>
    <label for ="scheduler_name">Scheduler Name: </label>
    <input type ="text" id="scheduler_name" name="scheduler_name" placeholder = "Informal Meeting" required>
    </div>

    <br>

    <div>
        <label for="creator_name">Name: </label>
        <input type ="text" id = "creator_name" name = "creator_name" required>
    </div>

    <br>

    <div>
        <label for="creator_password">Password: </label>
        <input type ="password" id = "creator_password" name = "creator_password" required>
    </div>


    <br>




    <div>
        <label for="limit">Participant Limit: </label>
        <input type ="number" id="limit" name="participant_limit" min="2" required>
    </div>

<br>

<div>
    <label for="potential_dates">Potential Dates for the Meeting: </label>
    <input type = "text" id="potential_dates" name="potential_dates" required>
</div>
<br>

<div>
    <label for="response_window">Duration of the Scheduler Poll (in hours):</label>
    <input type = "number" id="response_window" name="response_window" min="1" required>
</div>

<br>

    <div>
        <input type = "submit" value="Submit">
    </div>

 </form>


<script src="https://cdn.jsdelivr.net/npm/air-datepicker@3.6.0/air-datepicker.js"> </script>
<script>
const english = {
    days: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
  daysShort: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
  daysMin: ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'],
  months: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
  monthsShort: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
  today: 'Today',
  clear: 'Clear',
  dateFormat: 'dd/MM/yyyy',
  timeFormat: 'hh:mm aa',
  firstDay: 0
}

new AirDatepicker('#potential_dates', {locale: english, dateFormat: 'dd/MM/yyyy', visible: true,minDate: new Date(), multipleDates: 5, multipleDatesSeparator: ','});
</script>

</body>
</html>
